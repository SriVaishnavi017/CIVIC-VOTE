server:
  port: 8084

spring:
  application:
    name: RESULT-SERVICE
  datasource:
    url: jdbc:h2:mem:civicvote_result;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-civicvote-microservice-project-1234567890}

result:
  service:
    key: ${RESULT_SERVICE_KEY:dev-result-service-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
